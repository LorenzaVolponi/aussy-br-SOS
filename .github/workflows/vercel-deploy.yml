name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: vercel-production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_NAME: aussy-br-sos
      VERCEL_TEAM_SLUG: adm-wuazecoms-projects

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun 1.3.14
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cooldown before Vercel API calls
        run: sleep 45

      - name: Build and deploy prebuilt production with cooldown
        env:
          VERCEL_DEPLOY_COOLDOWN_SECONDS: '180'
          VERCEL_RATE_LIMIT_BACKOFF_SECONDS: '180'
          VERCEL_DEPLOY_MAX_ATTEMPTS: '3'
        run: bash scripts/vercel-safe-deploy.sh

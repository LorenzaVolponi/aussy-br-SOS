name: Vercel production fallback

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: vercel-production-fallback
  cancel-in-progress: true

jobs:
  deploy-fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for native Vercel integration
        if: github.event_name == 'push'
        run: sleep 90

      - name: Inspect Vercel status
        id: vercel
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            const combined = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha });
            const statuses = combined.data.statuses
              .filter((s) => s.context.toLowerCase().includes('vercel'))
              .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
            const latest = statuses[0];
            if (!latest) {
              core.setOutput('fallback', 'true');
              core.setOutput('state', 'missing');
              return;
            }
            core.info(`Vercel status: ${latest.state} -> ${latest.target_url || ''}`);
            core.setOutput('state', latest.state);
            core.setOutput('target', latest.target_url || '');
            core.setOutput('fallback', latest.state === 'success' ? 'false' : 'true');

      - name: Native deployment already healthy
        if: steps.vercel.outputs.fallback == 'false'
        run: echo "Native Vercel deployment succeeded; fallback not needed."

      - name: Detect fallback credentials
        id: creds
        if: steps.vercel.outputs.fallback == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          hook=false
          cli=false
          if [ -n "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then hook=true; fi
          if [ -n "${VERCEL_TOKEN:-}" ] && [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then cli=true; fi
          echo "hook=$hook" >> "$GITHUB_OUTPUT"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"

      - name: Trigger Vercel deploy hook
        if: steps.vercel.outputs.fallback == 'true' && steps.creds.outputs.hook == 'true'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          http_code="$(curl --silent --show-error --location --request POST --max-time 30 --output /tmp/vercel-hook-response --write-out '%{http_code}' "$VERCEL_DEPLOY_HOOK_URL")"
          cat /tmp/vercel-hook-response || true
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Deploy hook returned HTTP $http_code" >&2
            exit 1
          fi

      - name: Run prebuilt CLI fallback
        if: steps.vercel.outputs.fallback == 'true' && steps.creds.outputs.hook != 'true' && steps.creds.outputs.cli == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: bash scripts/vercel-safe-deploy.sh

      - name: Fail clearly when no fallback credentials exist
        if: steps.vercel.outputs.fallback == 'true' && steps.creds.outputs.hook != 'true' && steps.creds.outputs.cli != 'true'
        run: |
          echo "::error title=Vercel fallback unavailable::Native deploy failed and no VERCEL_DEPLOY_HOOK_URL or complete VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID secrets are configured."
          exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "## Aussy Vercel deployment"
            echo
            echo "Native status: \`${{ steps.vercel.outputs.state || 'unknown' }}\`"
            echo
            echo "Deploy hook configured: \`${{ steps.creds.outputs.hook || 'n/a' }}\`"
            echo "CLI fallback configured: \`${{ steps.creds.outputs.cli || 'n/a' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

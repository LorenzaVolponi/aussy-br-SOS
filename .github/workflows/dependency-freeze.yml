name: Dependency Freeze & Release Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/dependency-freeze.yml'
      - '.github/workflows/quality.yml'
      - 'scripts/**'
      - 'src/**'
      - 'public/**'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - 'postcss.config.mjs'

concurrency:
  group: dependency-freeze-main
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  certify-and-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Runtime versions
        run: |
          node --version
          bun --version
          bun --revision

      - name: Resolve dependencies and generate lockfile
        run: bun install

      - name: Require Bun lockfile
        run: test -f bun.lock

      - name: Full repository certification
        run: bun run verify:full
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Detect lockfile change
        id: lock
        shell: bash
        run: |
          if git diff --quiet -- bun.lock && git ls-files --error-unmatch bun.lock >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create lockfile pull request
        if: steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="chore/freeze-bun-lock-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add bun.lock
          git commit -m "chore: freeze Bun dependency graph"
          git push origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: freeze Bun dependency graph" \
            --body "Generated by the Dependency Freeze & Release Certification workflow after a successful real Bun install and full repository certification.\n\nRefs #4"

      - name: Lockfile already frozen
        if: steps.lock.outputs.changed == 'false'
        run: echo "bun.lock is already versioned and unchanged; certification completed without a lockfile PR."

name: Dependency Freeze & Release Certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/dependency-freeze.yml'
      - '.github/workflows/quality.yml'
      - 'scripts/**'
      - 'src/**'
      - 'public/**'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - 'postcss.config.mjs'

concurrency:
  group: dependency-freeze-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certify-frozen:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Runtime versions
        run: |
          node --version
          bun --version
          bun --revision

      - name: Require frozen dependency graph
        run: |
          test -f bun.lock
          bun install --frozen-lockfile
          git diff --exit-code -- package.json bun.lock

      - name: Full repository certification
        run: bun run verify:full
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Frozen graph certified
        run: echo "bun.lock is versioned, unchanged and installable with Bun 1.3.14."

name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Service Worker behavioral runtime tests
        run: node scripts/test-sw-runtime.mjs

      - name: INMET data-integrity tests
        run: node scripts/test-inmet-integrity.mjs

      - name: API trust tests
        run: node scripts/test-api-trust.mjs

      - name: Location and weather integrity tests
        run: node scripts/test-location-integrity.mjs

      - name: OSM tile policy tests
        run: node scripts/test-osm-policy.mjs

      - name: Client surface tests
        run: node scripts/test-client-surface.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Runtime versions
        run: |
          node --version
          bun --version
          bun --revision
          echo "commit=${GITHUB_SHA}"

      - name: Install frozen dependencies
        run: |
          test -f bun.lock
          bun install --frozen-lockfile

      - name: Repository safety invariants
        run: bun run verify:repo

      - name: Type check
        run: bun run type-check

      - name: Critical lint
        run: bun run lint:critical

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Release diagnostics
        if: always()
        shell: bash
        run: |
          next_version=$(node -p "require('./package.json').dependencies.next" 2>/dev/null || echo unknown)
          echo "## Aussy release diagnostics" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- bun.lock: $([ -f bun.lock ] && echo present || echo missing)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Next: ${next_version}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Node: $(node --version)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bun: $(bun --version 2>/dev/null || echo unavailable)" >> "$GITHUB_STEP_SUMMARY"

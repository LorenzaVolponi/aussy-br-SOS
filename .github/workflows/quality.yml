name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Service Worker behavioral runtime tests
        run: node scripts/test-sw-runtime.mjs

      - name: INMET data-integrity tests
        run: node scripts/test-inmet-integrity.mjs

      - name: API trust tests
        run: node scripts/test-api-trust.mjs

      - name: OSM tile policy tests
        run: node scripts/test-osm-policy.mjs

      - name: Client surface tests
        run: node scripts/test-client-surface.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Runtime versions
        run: |
          node --version
          bun --version
          bun --revision

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi

      - name: Repository safety invariants
        run: bun run verify:repo

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

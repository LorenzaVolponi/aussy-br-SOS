name: Vercel rescue live

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rescue:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'ci/vercel-rescue-live'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Vercel credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "Missing GitHub secret: VERCEL_TOKEN" >&2
            exit 2
          fi
          if [ -z "${VERCEL_ORG_ID:-}" ]; then
            echo "Missing GitHub secret: VERCEL_ORG_ID" >&2
            exit 2
          fi
          echo "Vercel credentials are present."

      - name: Resolve current Aussy Vercel project by name
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const token = process.env.VERCEL_TOKEN;
          const teamId = process.env.VERCEL_ORG_ID;
          const projectName = 'aussy-br-sos';
          const url = `https://api.vercel.com/v9/projects/${encodeURIComponent(projectName)}?teamId=${encodeURIComponent(teamId)}`;
          (async () => {
            const response = await fetch(url, {
              headers: { Authorization: `Bearer ${token}` }
            });
            const text = await response.text();
            if (!response.ok) {
              console.error(`Unable to resolve Vercel project ${projectName}: HTTP ${response.status}`);
              console.error(text.slice(0, 1000));
              process.exit(3);
            }
            const project = JSON.parse(text);
            if (!project.id) {
              console.error('Vercel project response did not include an id.');
              process.exit(4);
            }
            fs.appendFileSync(process.env.GITHUB_ENV, `VERCEL_PROJECT_ID=${project.id}\n`);
            console.log(`Resolved ${projectName} -> ${project.id}`);
          })().catch((error) => {
            console.error(error);
            process.exit(5);
          });
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull production configuration
        shell: bash
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact on GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt artifact to production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          output=$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" 2>&1)
          echo "$output"
          url=$(echo "$output" | grep -Eo 'https://[^ ]+\.vercel\.app' | tail -n1 || true)
          if [ -z "$url" ]; then
            echo "Unable to detect deployment URL from Vercel CLI output." >&2
            exit 6
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Production smoke test
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.deploy.outputs.url }}"
          curl --fail --silent --show-error --location "$base/" >/dev/null
          curl --fail --silent --show-error --location "$base/api/health" >/dev/null
          echo "Production smoke test passed: $base"

name: Vercel rescue live

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Same lock used by the normal production deploy and recovery workflow.
concurrency:
  group: vercel-production-global-lock
  cancel-in-progress: true

jobs:
  rescue:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'ci/vercel-rescue-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_NAME: aussy-br-sos

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Vercel credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "Missing GitHub secret: VERCEL_TOKEN" >&2
            exit 2
          fi
          if [ -z "${VERCEL_ORG_ID:-}" ]; then
            echo "Missing GitHub secret: VERCEL_ORG_ID" >&2
            exit 2
          fi
          echo "Vercel credentials are present."

      - name: Check repository deployment cooldown
        id: cooldown
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VERCEL_DEPLOY_COOLDOWN_MINUTES: '60'
          VERCEL_DEPLOY_WORKFLOW_FILE: vercel-deploy.yml
        run: bash scripts/vercel-deploy-cooldown.sh

      - name: Setup Node
        if: steps.cooldown.outcome != 'failure'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        if: steps.cooldown.outcome != 'failure'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build and deploy current project as prebuilt production
        if: steps.cooldown.outcome != 'failure'
        shell: bash
        env:
          VERCEL_DEPLOY_COOLDOWN_SECONDS: '180'
          VERCEL_RATE_LIMIT_BACKOFF_SECONDS: '180'
          VERCEL_DEPLOY_MAX_ATTEMPTS: '3'
        run: bash scripts/vercel-safe-deploy.sh

      - name: Explain skipped rescue
        if: steps.cooldown.outcome == 'failure'
        run: echo "Rescue deploy skipped because production was deployed successfully inside the 60-minute quota-protection window." >> "$GITHUB_STEP_SUMMARY"

name: Vercel rescue live

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rescue:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'ci/vercel-rescue-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_NAME: aussy-br-sos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Vercel credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "Missing GitHub secret: VERCEL_TOKEN" >&2
            exit 2
          fi
          if [ -z "${VERCEL_ORG_ID:-}" ]; then
            echo "Missing GitHub secret: VERCEL_ORG_ID" >&2
            exit 2
          fi
          echo "Vercel credentials are present."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build and deploy current project as prebuilt production
        shell: bash
        run: bash scripts/vercel-safe-deploy.sh

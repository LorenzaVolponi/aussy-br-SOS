name: Refresh Mobile Bun Lock

on:
  push:
    branches:
      - feat/mobile-hardware-navigation
    paths:
      - .github/workflows/refresh-mobile-bun-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/mobile-hardware-navigation
          fetch-depth: 0

      - name: Setup project Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Regenerate lockfile from package.json
        run: bun install

      - name: Verify frozen installation
        run: bun install --frozen-lockfile

      - name: Verify trust and mobile hardware contracts
        run: |
          node scripts/test-api-trust.mjs
          node scripts/test-mobile-hardware.mjs

      - name: Commit lockfile only
        run: |
          test -z "$(git status --short -- package.json)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "bun.lock already synchronized"
            exit 0
          fi
          git commit -m "fix: synchronize Bun lockfile"
          git push origin HEAD:feat/mobile-hardware-navigation

name: Generate dependency lock

on:
  push:
    branches: [fix/full-functional-audit-v2]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-functional-audit-v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Generate or verify bun.lock
        shell: bash
        run: |
          if [ -f bun.lock ]; then
            bun install --frozen-lockfile
          else
            bun install
            test -f bun.lock
          fi

      - name: Commit generated lock
        shell: bash
        run: |
          if git diff --quiet -- bun.lock && git ls-files --error-unmatch bun.lock >/dev/null 2>&1; then
            echo "bun.lock already versioned and unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): lock Bun dependency graph"
          git push origin HEAD:fix/full-functional-audit-v2
